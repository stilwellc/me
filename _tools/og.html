<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<title>OG card renderer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..500&family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap">
<style>
  html, body { margin: 0; background: #FCFBFA; }
  canvas { display: block; width: 1200px; height: 630px; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<script>
// Static dot-matrix social card: the page's glyph (halftone) on the left, the
// word as resolved squares on the right, a mono footer. Same cell logic as site.js.
(function () {
  var q = new URLSearchParams(location.search);
  var word = q.get('text') || 'Collin', src = q.get('src'), sub = q.get('sub') || 'Senior Product Security Engineer';
  var c = document.getElementById('c'), ctx = c.getContext('2d');
  var W = 1200, H = 630, cell = 14, cols = Math.floor(W / cell), rows = Math.floor((H - 120) / cell);
  var INK = '#161616', GROUND = '#FCFBFA';
  function halftone(img, x0, y0, w, h) {
    var p = document.createElement('canvas'); p.width = cols; p.height = rows; var pc = p.getContext('2d');
    pc.fillStyle = '#fff'; pc.fillRect(0, 0, cols, rows);
    var s = Math.min((w - 2) / img.naturalWidth, (h - 2) / img.naturalHeight), dw = img.naturalWidth * s, dh = img.naturalHeight * s;
    var ox = Math.round(x0 + (w - dw) / 2), oy = Math.round(y0 + (h - dh) / 2);
    pc.drawImage(img, ox, oy, dw, dh);
    var d = pc.getImageData(0, 0, cols, rows).data, lum = new Float32Array(cols * rows), inList = [], mean = 0;
    function inside(j) { var x = j % cols, y = (j / cols) | 0; return x >= ox + 1 && x < ox + dw - 1 && y >= oy + 1 && y < oy + dh - 1; }
    var raw = new Float32Array(cols * rows);
    for (var j = 0; j < cols * rows; j++) { raw[j] = (d[j*4]*299 + d[j*4+1]*587 + d[j*4+2]*114) / 255000; if (inside(j)) { inList.push(raw[j]); mean += raw[j]; } }
    mean /= Math.max(1, inList.length); var flip = mean > 0.5; inList.sort(function (a, b) { return a - b; });
    var lo = inList[Math.floor(inList.length * 0.05)], hi = inList[Math.floor(inList.length * 0.95)], span = Math.max(0.05, hi - lo);
    for (var k = 0; k < cols * rows; k++) { if (!inside(k)) { lum[k] = 0; continue; } var v = flip ? 1 - raw[k] : raw[k]; v = (v - (flip ? 1 - hi : lo)) / span; lum[k] = Math.pow(Math.min(1, Math.max(0, v)), 1.7); }
    return lum;
  }
  function wordMask(text, x0, w) {
    var m = document.createElement('canvas'); m.width = cols; m.height = rows; var mc = m.getContext('2d');
    mc.fillStyle = '#000'; mc.textBaseline = 'middle'; mc.textAlign = 'center';
    var fs = rows * 0.7; mc.font = '300 ' + fs + 'px "Bricolage Grotesque", Geist, Helvetica, Arial, sans-serif';
    while (mc.measureText(text).width > w * 0.94 && fs > 6) { fs -= 1; mc.font = '300 ' + fs + 'px "Bricolage Grotesque", Geist, Helvetica, Arial, sans-serif'; }
    mc.fillText(text, x0 + w / 2, rows * 0.52);
    var px = mc.getImageData(0, 0, cols, rows).data, mask = new Uint8Array(cols * rows);
    for (var i = 0; i < cols * rows; i++) mask[i] = px[i * 4 + 3] > 96 ? 1 : 0;
    return mask;
  }
  function draw(img) {
    ctx.fillStyle = GROUND; ctx.fillRect(0, 0, W, H);
    var top = 40, gx = 4, gw = img ? Math.floor(cols * 0.3) : 0, tx = img ? gx + gw + 2 : 2, tw = cols - tx - 2;
    var lum = img ? halftone(img, gx, 2, gw, rows - 4) : null, mask = wordMask(word, tx, tw);
    ctx.fillStyle = INK;
    for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) {
      var i = y * cols + x, cx = x * cell + cell / 2, cy = top + y * cell + cell / 2;
      if (lum && lum[i] > 0.04) { var q = cell * 0.86 * lum[i]; ctx.globalAlpha = 0.92; ctx.fillRect(cx - q / 2, cy - q / 2, q, q); }
      else if (mask[i]) { var s = cell * 0.62; ctx.globalAlpha = 0.92; ctx.fillRect(cx - s / 2, cy - s / 2, s, s); }
      else { ctx.globalAlpha = 0.14; ctx.fillRect(cx - 0.5, cy - 0.5, 1, 1); }
    }
    ctx.globalAlpha = 1; ctx.fillStyle = '#E4E1DB'; ctx.fillRect(40, H - 96, W - 80, 1);
    ctx.textBaseline = 'middle'; ctx.fillStyle = INK; ctx.textAlign = 'left';
    ctx.font = '500 34px "Bricolage Grotesque", Geist, Helvetica, Arial, sans-serif'; ctx.fillText('Collin Stilwell', 40, H - 50);
    ctx.fillStyle = '#55564F'; ctx.textAlign = 'right'; ctx.font = '400 24px "Geist Mono", Menlo, monospace'; ctx.fillText(sub, W - 40, H - 50);
    document.title = 'ready';
  }
  function go() { if (!src) return draw(null); var img = new Image(); img.onload = function () { draw(img); }; img.onerror = function () { draw(null); }; img.src = src; }
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('300 40px "Bricolage Grotesque"'), document.fonts.load('400 24px "Geist Mono"'), document.fonts.load('500 34px "Bricolage Grotesque"')]).then(go, go); else go();
})();
</script>
</body>
</html>
